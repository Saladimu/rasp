<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Admin | Saladimu Server</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/static/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <meta name="theme-color" content="#0b1220">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/static/style.css?v=6">
</head>
<body>
  <div class="shell">
    <section class="panel" id="login-panel">
      <div class="page-title">
        <h1>Admin Access</h1>
        <p>Sign in to manage applications and health checks.</p>
      </div>
      <div class="alert" id="login-error"></div>
      <form class="form" id="login-form">
        <label>Username <input name="username" autocomplete="username" required></label>
        <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
        <button class="btn" type="submit">Sign in</button>
        <a class="btn secondary" href="/">Back to dashboard</a>
      </form>
    </section>

    <div id="admin-panel" class="hidden">
      <header class="topbar">
        <div class="page-title">
          <h1>Service Manager</h1>
          <p>Add, edit, and monitor applications and personal websites.</p>
        </div>
        <div class="meta">
          <div class="chip" id="admin-user"></div>
          <button class="btn secondary" id="logout-btn" type="button">Logout</button>
          <a class="btn secondary" href="/">Dashboard</a>
        </div>
      </header>

      <div class="admin-wrap">
        <section class="admin-section" data-section="applications">
          <div class="admin-section-head">
            <button class="section-toggle" type="button" aria-expanded="true">
              <span class="chevron" aria-hidden="true"></span>
              <span>
                <span class="section-title">Applications</span>
                <span class="muted">Internal home-server services.</span>
              </span>
            </button>
            <button class="btn" id="add-btn" type="button">Add Application</button>
          </div>
          <div class="admin-section-body">
            <table class="table">
              <thead>
                <tr>
                  <th>App</th>
                  <th>URL</th>
                  <th>Health</th>
                  <th>Visible</th>
                  <th>Order</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="app-table"></tbody>
            </table>
          </div>
        </section>

        <section class="admin-section" data-section="websites">
          <div class="admin-section-head">
            <button class="section-toggle" type="button" aria-expanded="true">
              <span class="chevron" aria-hidden="true"></span>
              <span>
                <span class="section-title">Personal Website</span>
                <span class="muted">Public sites such as saladimu.my.id.</span>
              </span>
            </button>
            <button class="btn" id="add-website-btn" type="button">Add Website</button>
          </div>
          <div class="admin-section-body">
            <table class="table">
              <thead>
                <tr>
                  <th>Website</th>
                  <th>URL</th>
                  <th>Health</th>
                  <th>Visible</th>
                  <th>Order</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="website-table"></tbody>
            </table>
          </div>
        </section>

        <section class="admin-section" data-section="alerts">
          <div class="admin-section-head">
            <button class="section-toggle" type="button" aria-expanded="true">
              <span class="chevron" aria-hidden="true"></span>
              <span>
                <span class="section-title">Down Alerts</span>
                <span class="muted">Telegram or webhook after consecutive failed checks. Quiet hours skip noise.</span>
              </span>
            </button>
          </div>
          <div class="admin-section-body">
          <form class="form alert-form" id="alert-form">
            <div class="alert" id="alert-error"></div>
            <div class="alert success" id="alert-ok"></div>
            <label class="check"><input name="alert_enabled" type="checkbox"> Enable down alerts</label>
            <div class="row">
              <label>Telegram bot token <input name="telegram_bot_token" type="password" placeholder="Leave blank to keep current" autocomplete="off"></label>
              <label>Telegram chat ID <input name="telegram_chat_id" placeholder="123456789"></label>
            </div>
            <label>Webhook URL <input name="webhook_url" placeholder="https://example.com/hooks/home-server"></label>
            <div class="row">
              <label>Fail threshold <input name="fail_threshold" type="number" min="1" max="10" value="2"></label>
              <label>Timezone <input name="timezone" placeholder="UTC"></label>
            </div>
            <div class="row">
              <label>Quiet start <input name="quiet_start" placeholder="23:00"></label>
              <label>Quiet end <input name="quiet_end" placeholder="07:00"></label>
            </div>
            <div class="actions">
              <button class="btn" type="submit">Save Alerts</button>
              <button class="btn secondary" id="alert-test-btn" type="button">Send Test</button>
            </div>
          </form>
          </div>
        </section>

        <section class="admin-section" data-section="hosts">
          <div class="admin-section-head">
            <button class="section-toggle" type="button" aria-expanded="true">
              <span class="chevron" aria-hidden="true"></span>
              <span>
                <span class="section-title">Allowed Health-check Hosts</span>
                <span class="muted">Add a host here when saving an application fails the allowlist check.</span>
              </span>
            </button>
          </div>
          <div class="admin-section-body">
            <form class="form alert-form" id="host-form">
              <div class="alert" id="host-error"></div>
              <div class="alert success" id="host-ok"></div>
              <div class="row">
                <label>Host or URL <input name="host" placeholder="llm.saladimu.my.id" required></label>
              </div>
              <div class="actions">
                <button class="btn" type="submit">Add Host</button>
              </div>
              <p class="muted" id="env-hosts"></p>
              <table class="table">
                <thead>
                  <tr>
                    <th>Host</th>
                    <th>Source</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody id="host-table"></tbody>
              </table>
            </form>
          </div>
        </section>
      </div>
    </div>
  </div>

  <div class="modal-backdrop hidden" id="modal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-title">Application</h2>
      </div>
      <form class="form modal-form" id="app-form">
        <div class="modal-body">
          <div class="alert" id="form-error"></div>
          <input type="hidden" name="id">
          <input type="hidden" name="kind" value="application">
          <label>Name <input name="name" maxlength="80" required></label>
          <label>Description <textarea name="description" rows="2" maxlength="240"></textarea></label>
          <label id="url-label">Application URL <input name="url" placeholder="http://127.0.0.1:8081" required></label>
          <div class="row">
            <label>Icon
              <select name="icon">
                <option value="folder">Folder</option>
                <option value="brain">AI / Brain</option>
                <option value="send">Telegram</option>
                <option value="layout-grid">Grid</option>
                <option value="server">Server</option>
                <option value="globe">Globe</option>
                <option value="database">Database</option>
                <option value="cloud">Cloud</option>
                <option value="shield">Shield</option>
                <option value="terminal">Terminal</option>
                <option value="camera">Camera</option>
                <option value="music">Music</option>
                <option value="video">Video</option>
                <option value="mail">Mail</option>
                <option value="home">Home</option>
                <option value="box">Box</option>
                <option value="cpu">CPU</option>
                <option value="hard-drive">Disk</option>
                <option value="wifi">Wi-Fi</option>
                <option value="lock">Lock</option>
                <option value="user">Profile</option>
                <option value="users">Community</option>
                <option value="book-open">Blog / Book</option>
                <option value="newspaper">News</option>
                <option value="pen-line">Writing</option>
                <option value="file-text">Document</option>
                <option value="link">Link</option>
                <option value="external-link">External site</option>
                <option value="image">Gallery</option>
                <option value="palette">Portfolio</option>
                <option value="briefcase">Work</option>
                <option value="graduation-cap">Education</option>
                <option value="map-pin">Location</option>
                <option value="heart">Favorites</option>
                <option value="star">Featured</option>
                <option value="code">Code</option>
                <option value="rss">RSS</option>
                <option value="share-2">Share</option>
                <option value="message-circle">Chat</option>
                <option value="phone">Contact</option>
                <option value="calendar">Calendar</option>
                <option value="shopping-bag">Shop</option>
                <option value="gamepad-2">Games</option>
              </select>
            </label>
            <label>Display order <input name="display_order" type="number" min="0" value="0"></label>
          </div>
          <div class="row">
            <label>Health method
              <select name="health_method">
                <option value="http">HTTP</option>
                <option value="https">HTTPS</option>
                <option value="tcp">TCP</option>
              </select>
            </label>
            <label>Health port <input name="health_port" type="number" min="1" max="65535" placeholder="Optional"></label>
          </div>
          <label>Health-check URL or host <input name="health_url" placeholder="http://127.0.0.1:8081/health"></label>
          <label class="check"><input name="monitoring_enabled" type="checkbox" checked> Enable status monitoring</label>
          <label class="check"><input name="visible" type="checkbox" checked> Show on dashboard</label>
          <label>Upload custom icon <input id="icon-file" type="file" accept=".png,.svg,.webp,.jpg,.jpeg"></label>
        </div>
        <div class="modal-footer actions">
          <button class="btn" type="submit">Save</button>
          <button class="btn secondary" id="cancel-btn" type="button">Cancel</button>
        </div>
      </form>
    </div>
  </div>
  <script src="/static/admin.js?v=7"></script>
</body>
</html>
